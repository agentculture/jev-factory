[project]
name = "jev-factory"
version = "0.9.1"
description = "Jev factory: turns nvsh's Tool-Jev fine-tune process into a reusable pipeline for building jev-like models, with knobs and per-run decision tools, then fine-tunes its own model to drive those decisions (self-hosting)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
# torch is installed separately from the PyTorch cu130 index (see docs/training-env.md).
# Pins mirror ../nvsh/scripts/lfm-finetune/requirements-train.txt.
train = [
    "torchvision==0.27.1",
    "triton==3.7.1",
    "transformers==5.5.0",
    "tokenizers==0.22.2",
    "huggingface-hub==1.32.0",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
    "peft==0.21.0",
    "trl==0.24.0",
    "datasets==4.3.0",
    "bitsandbytes==0.50.2",
    "numpy==2.5.3",
    "unsloth==2026.9.9",
    "unsloth-zoo==2026.9.7",
]

[project.urls]
Homepage = "https://github.com/agentculture/jev-factory"
Issues = "https://github.com/agentculture/jev-factory/issues"

[project.scripts]
jev = "jev_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_factory"]

[dependency-groups]
evals = [
    "deepeval==4.2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["jev_factory"]
omit = ["jev_factory/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=jev_factory (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["jev_factory"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:deepeval"
markers = [
    "behavioral(obligation_id): ties a test to one spec obligation id (for example o5)",
]

[tool.uv]
# deepeval pins click<8.4 while huggingface-hub (train) needs click>=8.4.2:
# the training env and the evals env are separate by design.
conflicts = [[{ extra = "train" }, { group = "evals" }]]
