# Run config for `jev run`. Copy to a private file and fill in.
#
# Precedence for EVERY key, the measure context included:
#   CLI flag  >  this file  >  environment (JEV_<KEY>, e.g. JEV_MEASURE_CTX)  >  default
#
# No secret belongs here. The *_env keys name the environment variable that
# holds a secret; the value is injected by the operator at run time.

# --- identity of the run (required) ---
work = "/path/to/work-root"          # outside any git worktree
base = "org/base-model"
base_rev = "0000000000000000000000000000000000000000"
hub_prefix = "org/model-family"
licence = "Apache-2.0"
issue_refs = ""                      # comma-separated, optional

seed = 46

# --- tool paths (optional until a stage needs them) ---
# train_py = "/path/to/train-venv/bin/python"
# llama_cpp_convert = "/path/to/llama.cpp/convert_hf_to_gguf.py"
# llama_cpp_quantize = "/path/to/llama.cpp/build/bin/llama-quantize"
# llama_cpp_imatrix = "/path/to/llama.cpp/build/bin/llama-imatrix"
# llama_server = "/path/to/llama.cpp/build/bin/llama-server"
# awq_python = "/path/to/awq-venv/bin/python"
# hf_cache = "/path/to/hf-cache"

# --- measurement ---
# measure_image = "registry/image@sha256:<digest>"   # a tag is refused
measure_port = 18060
measure_ctx = 2048
measure_gpu_fraction = 0.08
measure_max_logprobs = 20000
measure_gpu_layers = 999        # llama-server --n-gpu-layers; 0 serves the GGUF on the CPU
enable_thinking = false
# tool_call_parser = "<parser>"
# ground_snapshot = "/path/to/ground-snapshot.json"

# --- resource caps ---
# train_memory_max = "24G"
train_memory_floor = "8G"
train_watchdog_seconds = 5
# train_gpu_memory_gb = 40

# --- teachers ---
# aug_url = "<chat-completions url of your teacher gateway>"
workers = 2
teacher_generator_model = "worker"
teacher_reviewer_a_model = "senses"
teacher_reviewer_b_model = "cortex"
# teacher_models = "<json {alias: {name, licence}} listing extra Apache-2.0 teachers>"
teacher_generator_max_tokens = 12000
teacher_reviewer_max_tokens = 8192
teacher_timeout = 300.0
# teacher_reasoning_effort = "low"
# teacher_cache = "<dir for the teacher response cache; default under work>"

# --- the distillery (jev distill); endpoints are localhost /v1/systemone servers ---
# distill_records = "/path/to/records.jsonl"
# distill_pin_cache = "/path/to/student-pin-cache"
# distill_base_revision = "<base commit; default: the pinned base, b1485b2>"
# distill_decider_revision = "<strands-decider-2B-qwen3.5-v1-2610 commit>"
# distill_decider_repo = "/path/to/strands-decider"
# distill_trainer_python = "/path/to/trainer-env/bin/python"
# distill_student_python = "/path/to/student-env/bin/python"
# distill_student_lockfile = "<sha256 of the student env lockfile>"
distill_student_port = 18070
# distill_teacher_url = "<localhost systemone url of the teacher>"
# distill_teacher_model = "<served teacher model name>"
# distill_teacher_repo = "<org/teacher-repo>"
# distill_teacher_revision = "<teacher commit>"
# distill_teacher_build_id = "<teacher build id>"
# distill_teacher_engine = "sglang"
# distill_alt_teacher_url = "<localhost systemone url of the correction drafter>"
# distill_alt_teacher_model = "<served drafter model name>"
# distill_stock_url = "<localhost systemone url of the stock model>"
# distill_stock_model = "<served stock model name>"
# distill_probe_set = "<path to the operator-held Clef probe set; never committed>"
# distill_side_model_list = "<path to the operator-held side-model names; never committed>"
# distill_teacher_model_header = "<model name sent as X-Lobes-Model, if the gateway routes>"
# distill_gold_ledger = "<path to the human-gold ledger; default beside test.jsonl>"
# distill_jevbench_tasks = "<path to the 231 JevBench w4096 public tasks, record JSONL>"
# distill_agx_url = "<localhost tunnel url of the shipped quant on the AGX Orin>"
# distill_edge_url = "<localhost tunnel url of the shipped quant on the edge board>"
# distill_edge_memory_cap = "4G"

# --- secrets, by the NAME of the environment variable ---
# aug_key_env = "TEACHER_GATEWAY_KEY"
# distill_teacher_key_env = "DISTILL_TEACHER_KEY"
hf_token_env = "HF_TOKEN"
